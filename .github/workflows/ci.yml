name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # gcc (for riscv-emu.exe itself) and clang+llvm-objcopy (for the
      # RISC-V guest test programs its own test suite compiles) - see
      # THIRD_PARTY.md for why neither is ever bundled/shipped, only used
      # here to build and test. qemu is the real qemu-system-riscv64
      # `make compare`'s differential tests check riscv-emu's own output
      # against. windows-latest's chocolatey is already installed; these
      # three are not preinstalled on the image.
      - name: Install build tools (gcc, LLVM, QEMU)
        run: |
          choco install mingw llvm qemu -y --no-progress
        shell: pwsh

      # Chocolatey's mingw package registers its own PATH entry (visible
      # in the install log as "PATH environment variable does not have
      # ... Adding..."), but its qemu package does not - confirmed the
      # hard way: this workflow's own first real run built riscv-emu.exe
      # fine (gcc was found) but `make compare` failed with "Error 127"
      # (qemu-system-riscv64: command not found), producing an empty
      # build-qemu.out that then "differed" from every line of riscv-emu's
      # own real output - not an actual emulator regression, just QEMU
      # never being on PATH to begin with. $GITHUB_PATH, not $env:PATH -
      # a plain in-process PATH edit would not survive into the next step
      # anyway, since each `run:` spawns a fresh shell.
      - name: Add QEMU to PATH
        run: echo "C:\Program Files\qemu" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        shell: pwsh

      - name: Build riscv-emu
        working-directory: riscv-emu
        run: make
        shell: bash

      - name: riscv-emu unit test
        working-directory: riscv-emu
        run: make test
        shell: bash

      - name: riscv-emu differential test (vs real QEMU)
        working-directory: riscv-emu
        run: make compare
        shell: bash

      - name: riscv-emu fast suite (unit + differential + integration)
        working-directory: riscv-emu
        run: make test-all
        shell: bash

      # boot-test/interactive-test/fs-compare all need a real riscv64
      # Linux kernel+initramfs via --kernel - a from-scratch, reproducible
      # Buildroot build (see riscv-emu/buildroot/ and
      # .github/workflows/guest-images.yml), published as a release asset
      # since this repo deliberately does not commit it to git (see
      # THIRD_PARTY.md). GH_TOKEN is required here specifically because
      # this repo is private: scripts/fetch-guest-images.sh's own fetch
      # of that asset goes through `gh release download`, not plain curl,
      # since a private repo's release assets 404 for an unauthenticated
      # request (confirmed directly) - GITHUB_TOKEN is what `gh` already
      # auto-detects for this. A real fetch failure now fails this step
      # (and the job) loudly rather than being silently tolerated - the
      # kernel is no longer "not available yet" as a matter of course, so
      # a failure here means something is actually wrong (bad token,
      # asset renamed/deleted, ...) and deserves attention. The next
      # step's own if/else check is for other invocation paths (a
      # developer running these Makefile targets locally without having
      # run this fetch step first), not for tolerating a failure here.
      - name: Fetch guest images
        working-directory: riscv-emu
        run: bash scripts/fetch-guest-images.sh
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Kernel-dependent tests (boot-test/interactive-test/fs-compare)
        working-directory: riscv-emu
        run: |
          if [ -f boot/KernelImage ] && [ -f boot/initramfs.cpio.gz ]; then
            make boot-test
            make interactive-test
            make fs-compare
          else
            echo "::warning::Skipping boot-test/interactive-test/fs-compare - boot/KernelImage and boot/initramfs.cpio.gz are not available. Expected if the Fetch guest images step above did not run (e.g. a local invocation of just this Makefile target); it already fails this job loudly if it was expected to fetch them and could not."
          fi
        shell: bash

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build UHP.Core + QemuManager.SelfTest
        working-directory: QemuManager
        run: dotnet build QemuManager.SelfTest/QemuManager.SelfTest.csproj -c Release

      - name: Build QemuManager (WPF)
        working-directory: QemuManager
        run: dotnet build QemuManager/QemuManager.csproj -c Release

      # choco's qemu installs under "C:\Program Files\qemu" by default,
      # matching AppSettings' own fallback default - no path override
      # needed here, same as a real user's default install.
      - name: Run QemuManager.SelfTest
        working-directory: QemuManager
        run: dotnet QemuManager.SelfTest/bin/Release/net8.0/QemuManager.SelfTest.dll "C:\Program Files\qemu" "..\riscv-emu"
        shell: pwsh
